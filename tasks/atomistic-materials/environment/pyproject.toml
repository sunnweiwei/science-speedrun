[project]
name = "atomistic-materials"
version = "0.1.0"
description = "Evaluation-first prototype for inorganic interatomic potential improvement"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ase==3.26.0",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "pymatgen==2025.6.14",
  "phonopy==3.5.1",
  "phono3py==3.30.0",
  "moyopy==0.21.0",
  "requests==2.32.5",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
uma = ["fairchem-core==2.16.0", "pyarrow==20.0.0", "torch-dftd==0.5.1"]
data = [
    "ase-db-backends==0.11.0",
    "ijson==3.4.0",
]

[dependency-groups]
dev = [
    "ijson==3.4.0",
    "pytest==8.4.2",
    "ruff==0.12.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["environment/evaluation"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
