volumes:
  sealed:
  verifier_logs:

services:
  main:
    build:
      context: ..
      dockerfile: tests/Dockerfile
    network_mode: none
    # Main resources come from task.toml or the explicit evaluation profile.
    shm_size: "16gb"
    volumes:
      - type: bind
        source: ${TASK_DATA_DIR:?Set TASK_DATA_DIR}/verifier
        target: /benchmark
        read_only: true
        bind:
          create_host_path: false
      - sealed:/sealed
      - verifier_logs:/logs/verifier
    healthcheck:
      test: ["CMD-SHELL", "test -s /benchmark/manifest.json && test -s /benchmark/queries.jsonl && test -s /benchmark/candidate_pools.jsonl"]
      interval: 5s
      timeout: 5s
      retries: 3

  grader:
    build:
      context: ..
      dockerfile: tests/Dockerfile
    network_mode: none
    cpus: 16
    mem_limit: "16g"
    command: ["python", "/tests/grader.py", "--sealed", "/sealed/run", "--input", "/benchmark", "--labels", "/private", "--output", "/sealed/results"]
    volumes:
      - type: bind
        source: ${TASK_DATA_DIR:?Set TASK_DATA_DIR}/verifier
        target: /benchmark
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TASK_PRIVATE_DIR:?Set TASK_PRIVATE_DIR}
        target: /private
        read_only: true
        bind:
          create_host_path: false
      - sealed:/sealed
