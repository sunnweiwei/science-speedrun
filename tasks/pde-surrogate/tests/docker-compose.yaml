# Separate verifier overlay (task.toml: [verifier] environment_mode = "separate"). `main` is built
# from tests/Dockerfile with the task directory as context, because that file copies
# environment/evaluation and the split manifests as well as tests/.
#
# The data mount is a VERIFIER materialization (held-out files and tails present):
#   python3 environment/data/materialize.py DEST --manifest environment/data/split.json --sources -
# It is mounted under /private, a root-only directory of the image, because the truth the package
# must not see is derived from it: when Bubblewrap cannot start (Docker usually refuses the network
# namespace) the verifier runs the package as an unprivileged uid, and that uid can traverse neither
# /private nor /tests. reward.json records the mode ("bwrap" or "uid"). security_opt lets Bubblewrap
# create what namespaces the host allows. No network: the package must not reach anything. Harbor
# uploads the submission to /workspace/submission and reads /logs/verifier/reward.json.
services:
  main:
    build:
      context: ..
      dockerfile: tests/Dockerfile
    shm_size: "16gb"
    network_mode: none
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    volumes:
      - type: bind
        source: ${TASK_PRIVATE_DIR:?Set TASK_PRIVATE_DIR to the verifier data directory (materialize.py DEST --manifest split.json)}
        target: /private/data
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "{ test -f /private/data/materialize-receipt.json || test -f /private/data/release-receipt.json; } && test -x /tests/test.sh && test -s /tests/evaluation/score_bounds.json && test -s /tests/split.json && find /private -maxdepth 0 -perm 700 | grep -q ."]
      interval: 10s
      timeout: 30s
      retries: 3
