schema_version = "1.3"
artifacts = ["/workspace/submission"]

[task]
name = "ai4sci/protein-sequence-modeling"
version = "0.1.0"
description = "Continuously improve one from-scratch protein sequence model across eleven equally weighted PEER tasks."
authors = [{ name = "YiFang99" }]
keywords = ["model-development", "protein", "peer", "multi-task", "offline"]

[metadata]
input_schema = "peer-protein-input/v1"
pretrain_schema = "peer-protein-pretrain/v1"
peer_reference = "Xu et al., PEER: A Comprehensive and Multi-Task Benchmark for Protein Sequence Understanding, NeurIPS 2022 Datasets and Benchmarks"
data_status = "operator materialization from pinned TAPE/PEER S3 archives plus the full decontaminated UniRef50 corpus; verified end to end on real data"

[agent]
timeout_sec = 172800.0          # external development budget (48 h); the agent is not told

[environment]
network_mode = "no-network"
gpus = 8
storage_mb = 1048576
build_timeout_sec = 7200.0
gpu_types = ["H100"]
cpus = 64
memory_mb = 524288

[verifier]
environment_mode = "separate"
# Verifier replay limit only; it does not constrain development.
timeout_sec = 86400.0

[verifier.environment]
network_mode = "no-network"
gpus = 1
build_timeout_sec = 7200.0
