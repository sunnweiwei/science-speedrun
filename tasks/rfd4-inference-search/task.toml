schema_version = "1.3"
artifacts = ["/workspace/submission"]

[task]
name = "ai4sci/rfd4-inference-search"
version = "0.3.1"
description = "Develop an executable inference program for frozen RFD4-Proteina on runtime monomer requests under a one-GPU time budget."
authors = [{name = "Science Speedrun contributors"}]
keywords = ["model-development", "inference-time-search", "structural-biology"]

[metadata]
data_status = "Pinned length-only monomer inputs, generation and refolding weights, private replay seeds."
primary_metric = "mean_per_length_clustered_pass_rate"
primary_metric_direction = "maximize"
official_reference = "Figure 2 and Table S29, four-suite archived quality-throughput curves"
live_score_scope = "Unconditional monomers"

[agent]
timeout_sec = 172800.0

[environment]
network_mode = "no-network"
cpus = 64
memory_mb = 131072
storage_mb = 512000
gpus = 1
gpu_types = ["H100"]
build_timeout_sec = 7200.0

[verifier]
environment_mode = "separate"
timeout_sec = 14400.0

[verifier.environment]
network_mode = "no-network"
cpus = 16
memory_mb = 98304
storage_mb = 131072
gpus = 1
gpu_types = ["H100"]
build_timeout_sec = 7200.0
