services:
  main:
    build:
      context: ..
      dockerfile: tests/Dockerfile
      target: verifier
    shm_size: 8gb
    # The trusted verifier creates the submission's offline, capability-free PID/mount namespace.
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
      - systempaths=unconfined
    cap_add: [SYS_ADMIN]
    environment:
      RFD4_VERIFIER_MODE: "${RFD4_VERIFIER_MODE:-four_track}"
      RFD4_VERIFY_PANEL: "${RFD4_VERIFY_PANEL:-verify}"
      RFD4_VERIFY_ATTEMPTS: "${RFD4_VERIFY_ATTEMPTS:-20}"
      RFD4_VERIFY_REPEATS: "${RFD4_VERIFY_REPEATS:-1}"
      RFD4_REFERENCES: "${RFD4_REFERENCES:-native-low native-high}"
      RFD4_SECONDS_PER_SLOT: "${RFD4_SECONDS_PER_SLOT:-60}"
      RFD4_REFERENCE: "${RFD4_REFERENCE:-stochastic-tsr}"
    volumes:
      - type: bind
        source: ${TASK_DATA_DIR:?Run the materializer}/assets
        target: /workspace/data/assets
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TASK_PRIVATE_DIR:?Set the private data directory}
        target: /private
        read_only: true
        bind: {create_host_path: false}
