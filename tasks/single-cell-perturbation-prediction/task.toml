schema_version = "1.3"
artifacts = ["/workspace/submission"]

[task]
name = "ai4sci/single-cell-perturbation-prediction"
version = "0.1.0"
description = "Continuously improve one model that predicts single-cell CRISPRi responses in cellular contexts never seen perturbed (VCC 2026 zero-shot setting)."
keywords = ["model-development", "virtual-cell", "single-cell", "perturbation", "zero-shot"]
authors = [{ name = "sunnweiwei" }]

[metadata]
data_status = "published: prepared release v1 on HF sunweiwei/ai4sci-virtual-cell-zeroshot-data (dev 169 GB + private 22 GB, pinned revision in environment/data/download-source.json) built from pinned public sources (Replogle 2022, Nadig 2025, X-Atlas/Orion, VCC 2025, DepMap 24Q4, GO); SE-600M fetched from arcinstitute/SE-600M@5a9a80f"
primary_reference = "STATE (Adduri et al. 2025) zero-shot held-out-context evaluation; Arc Virtual Cell Challenge 2026"

[agent]
timeout_sec = 172800.0

[environment]
network_mode = "no-network"
cpus = 64
memory_mb = 524288
storage_mb = 1048576
gpus = 8
gpu_types = ["H100"]
build_timeout_sec = 7200.0

[verifier]
environment_mode = "separate"
timeout_sec = 14400.0

[verifier.environment]
network_mode = "no-network"
cpus = 32
memory_mb = 262144
gpus = 1
gpu_types = ["H100"]
build_timeout_sec = 7200.0
