<text x="60" y="62" font-size="33" fill="#182534" font-weight="600" text-anchor="start">Recover a logical bit from noisy quantum measurements</text>
<text x="60" y="101" font-size="21" fill="#566675" font-weight="400" text-anchor="start">Repeated stabilizer checks reveal error patterns; a decoder infers whether the stored logical observable flipped.</text>
