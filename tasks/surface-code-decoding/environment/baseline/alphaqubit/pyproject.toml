[project]
name = "surface-code-decoding-baselines"
version = "0.1.0"
description = "Bounded reproduction of Sycamore surface-code neural and matching decoders"
requires-python = ">=3.11,<3.12"
dependencies = [
  "tensorflow[and-cuda]==2.15.1",
  "numpy==1.26.4",
  "scipy==1.13.1",
  "stim==1.15.0",
  "pymatching==2.3.1",
  "pyyaml==6.0.2",
  "xarray==2024.3.0",
  "netcdf4==1.7.2",
  "networkx==3.4.2",
  "lmfit==1.3.3",
  "pytest==8.3.5",
]
