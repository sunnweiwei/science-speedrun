schema_version = "1.3"
artifacts = ["/workspace/submission"]

[task]
name = "ai4sci/target-based-drug-screening"
version = "0.3.0"
description = "Continuously develop one transferable pocket-to-molecule screening model."
authors = [{ name = "Zifeng Wang" }]
keywords = ["model-development", "drug-discovery", "virtual-screening"]

[metadata]
scoring_protocol = "drugclip-dataset-bedroc/v2"
data_status = "Pinned data and released epoch-14 weights. Dataset-balanced BEDROC(80.5) 0.166385 from two independent full-suite replays; EF1% 16.108 retained. See docs/ACCEPTANCE.md for scope."

[agent]
timeout_sec = 172800.0

[environment]
network_mode = "no-network"
cpus = 64
memory_mb = 524288
storage_mb = 1048576
gpus = 8
gpu_types = ["H100"]
build_timeout_sec = 7200.0

[verifier]
environment_mode = "separate"
timeout_sec = 86400.0

[verifier.environment]
network_mode = "no-network"
cpus = 16
memory_mb = 65536
gpus = 1
gpu_types = ["H100"]
build_timeout_sec = 7200.0
