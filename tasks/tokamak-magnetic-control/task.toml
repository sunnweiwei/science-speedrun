schema_version = "1.3"
artifacts = ["/workspace/submission"]

[task]
name = "ai4sci/tokamak-magnetic-control"
version = "0.2.0"
description = "Continuously develop one shared closed-loop magnetic (shape/position/current) controller for a MAST-U-like tokamak simulated by FreeGSNKE, scored by the fraction of sealed-plant episodes within the MAST-U steady-state tolerances."
authors = [{ name = "Weiwei Sun" }]
keywords = ["model-development", "autoresearch", "plasma-control", "tokamak", "reinforcement-learning"]

[metadata]
readiness = "v0.3 suite scored with tokamak-shape-metrics/v4 (105 sealed episodes, every episode in the denominator, deterministic solver work budgets, bounded fallback ladder and one rerun, latency gate after the replay); validated with 34 unit tests, fault injection, bitwise cross-run determinism on 28 hard episodes and a Harbor run of shape_vc (48/105); hold-current 0/105; two agent sessions under v3 (35 episodes): 0.667 and 0.636 vs shape_vc 0.486"
data_status = "no large data in the images; machine description vendored from FreeGSNKE (LGPL-3.0); randomization ranges derived from FAIR-MAST (CC BY-SA 4.0) by environment/data/fair_mast/ (developer-side, kept out of the images by .dockerignore)"
simulator = "FreeGSNKE 3.1.0 free-boundary evolutive Grad-Shafranov; nonlinear solver is ground truth"
training_regime = "known-task randomized-plant RL; sealed plant (wider ranges plus named mechanisms) for scoring"
env_version = "tokagym-mastu/v0.3"
metric_version = "tokamak-shape-metrics/v4"
scoring = "reward = fraction of all 105 sealed episodes (7 cases x 15 seeds) kept with steady-state shape and gaps <= 1 cm and Ip error <= 3% (MAST-U requirement); solver failures retried on a bounded fallback ladder, host-side failures rerun once; tolerance_time_fraction and per-case physical metrics alongside; invalid package or median policy compute > 0.5 ms (measured after the replay) scores 0"

[agent]
timeout_sec = 172800.0          # external development budget (TASK_STANDARD default); the agent is not told

[environment]
network_mode = "no-network"
cpus = 64
memory_mb = 131072
storage_mb = 512000
gpus = 1
gpu_types = ["H100"]
build_timeout_sec = 7200.0

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 72000.0           # bound: one wave, bounded replays, one rerun of a stalled episode (typical: see README)

[verifier.environment]
# One single-threaded worker per sealed episode (105) plus two CPUs for the supervisor and policy
# processes, so the suite runs in one wave.
cpus = 112
memory_mb = 98304
storage_mb = 10240
network_mode = "no-network"
build_timeout_sec = 7200.0
